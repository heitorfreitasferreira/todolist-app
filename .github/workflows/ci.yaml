name: ci
on:
  push:
    branches: [staging, production]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/heitorfreitasferreira/todolist-app
  KUSTOMIZE_VERSION: v5.7.1

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # Actions pinadas por SHA (tag como comentario): supply-chain.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
  bump:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mapear branch -> overlay (GitLab Flow)
        id: overlay
        run: |
          case "${{ github.ref_name }}" in
            staging)    echo "name=staging" >> "$GITHUB_OUTPUT" ;;
            production) echo "name=production" >> "$GITHUB_OUTPUT" ;;
            *) echo "branch sem overlay: ${{ github.ref_name }}"; exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: heitorfreitasferreira/cesar-challenge
          ref: main
          token: ${{ secrets.GITOPS_BUMP_TOKEN }}
      - name: Instalar kustomize pinado
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" -o /tmp/kustomize.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo install -m 755 /tmp/kustomize /usr/local/bin/kustomize
          kustomize version
        env:
          KUSTOMIZE_VERSION: ${{ env.KUSTOMIZE_VERSION }}
      - name: Pin digest no overlay (kustomize edit, idempotente)
        run: |
          cd k8s/overlays/${{ steps.overlay.outputs.name }}
          kustomize edit set image "$IMAGE=$IMAGE@${{ needs.build.outputs.digest }}"
          kustomize build . > /dev/null && echo "overlay valido"
          git diff
      - name: Commit do bump (com retry de rebase)
        run: |
          git config user.name "ci-bump"
          git config user.email "ci-bump@users.noreply.github.com"
          git add k8s/overlays/${{ steps.overlay.outputs.name }}/kustomization.yaml
          git commit -m "deploy(${OVERLAY}): todolist-app@${{ needs.build.outputs.digest }}" || echo "nada a commitar"
          git pull --rebase origin main && git push origin main
        env:
          OVERLAY: ${{ steps.overlay.outputs.name }}
