name: ci
on:
  push:
    branches: [staging, production]
  pull_request:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/heitorfreitasferreira/todolist-app

jobs:
  promote-guard:
    # Hotfix direto para production e permitido; qualquer outra origem, nao.
    # Roda em PR para production e reprova se o head nao for staging nem hotfix/*.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: |
          case "${{ github.head_ref }}" in
            staging|hotfix/*) echo "origem permitida: ${{ github.head_ref }}" ;;
            *) echo "PR para production so de staging ou hotfix/* (veio de '${{ github.head_ref }}')"; exit 1 ;;
          esac
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # Actions pinadas por SHA (tag como comentario): supply-chain.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
  bump:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mapear branch -> overlay (GitLab Flow)
        id: overlay
        run: |
          case "${{ github.ref_name }}" in
            staging)    echo "name=staging" >> "$GITHUB_OUTPUT" ;;
            production) echo "name=production" >> "$GITHUB_OUTPUT" ;;
            *) echo "branch sem overlay: ${{ github.ref_name }}"; exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: heitorfreitasferreira/cesar-challenge
          ref: main
          token: ${{ secrets.GITOPS_BUMP_TOKEN }}
      - name: Pin digest no overlay (update cirurgico: so newTag+digest)
        run: |
          python3 - "$IMAGE" "${{ github.sha }}" "${{ needs.build.outputs.digest }}" <<'EOF'
          import re, sys
          image, sha, digest = sys.argv[1], sys.argv[2], sys.argv[3]
          p = "k8s/overlays/${{ steps.overlay.outputs.name }}/kustomization.yaml"
          s = open(p).read()
          assert f"name: {image}\n" in s, "bloco images ausente no overlay"
          # So as duas linhas escalares: formato/comentarios preservados.
          s2, n1 = re.subn(r"(?m)^( +newTag: ).*$", rf"\g<1>{sha}", s, count=1)
          s2, n2 = re.subn(r"(?m)^( +digest: ).*$", rf"\g<1>{digest}", s2, count=1)
          assert (n1, n2) == (1, 1), "newTag/digest nao encontrados"
          open(p, "w").write(s2)
          print(open(p).read())
          EOF
      - name: Validar overlay (YAML parseavel)
        run: python3 -c "import yaml; yaml.safe_load(open('k8s/overlays/${{ steps.overlay.outputs.name }}/kustomization.yaml')); print('overlay valido')"
      - name: Commit do bump (com retry de rebase)
        run: |
          git config user.name "ci-bump"
          git config user.email "ci-bump@users.noreply.github.com"
          git add k8s/overlays/${{ steps.overlay.outputs.name }}/kustomization.yaml
          git commit -m "deploy(${OVERLAY}): todolist-app@${{ needs.build.outputs.digest }}" || echo "nada a commitar"
          git pull --rebase origin main && git push origin main
        env:
          OVERLAY: ${{ steps.overlay.outputs.name }}
