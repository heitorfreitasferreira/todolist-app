name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/heitorfreitasferreira/todolist-app

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
  bump:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: heitorfreitasferreira/cesar-challenge
          ref: main
          token: ${{ secrets.GITOPS_BUMP_TOKEN }}
      - name: Pin digest no overlay (tag imutavel por SHA + digest)
        run: |
          python3 - "$IMAGE" "${{ github.sha }}" "${{ needs.build.outputs.digest }}" <<'EOF'
          import re, sys
          image, sha, digest = sys.argv[1], sys.argv[2], sys.argv[3]
          short = digest.split(":", 1)[1] if ":" in digest else digest
          p = "k8s/overlays/desafio/kustomization.yaml"
          s = open(p).read()
          block = f"""images:
            - name: {image}
              newTag: {sha}
              digest: {short}
          """
          s2 = re.sub(r"images:\n(?:  .*\n?)+", block, s)
          open(p, "w").write(s2)
          print(open(p).read())
          EOF
      - name: Commit do bump
        run: |
          git config user.name "ci-bump"
          git config user.email "ci-bump@users.noreply.github.com"
          git add k8s/overlays/desafio/kustomization.yaml
          git commit -m "deploy: todolist-app@${{ needs.build.outputs.digest }}" || echo "nada a commitar"
          git push
